{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="light" data-bs-theme="light">
    {% include 'product-header.html' %}
    {% include 'product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="dashboard-container">
        <div id="dashboard-wrapper" class="d-none">
          <div id="dashboard-header">
            <div id="dashboard-header-content">
              <img id="dashboard-header-logo" src="{% static 'img/logo-light.webp' %}">
              <h1 id="dashboard-headline">{% trans 'product.dashboard.welcome' %}<br> </h1>
            </div>
          </div>
          <div id="dashboard-content">
            <div id="dashboard-tip-container" class="dashboard-content-entry">
              <h2 class="fw-bold mb-4">{% trans 'product.dashboard.tip.headline' %}</h2>
              <div id="dashboard-tip">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  $(document).ready(function() {
    displayLoader();
    fetchUsername(function(username) {
      fetch2FA(function(twoFactorEnabled) {
        displayDashboard(username, currentTarget, twoFactorEnabled);
      });
    });
  });

  function displayDashboard(username, currentTarget, activities, tutorialActive, twoFactorEnabled) {
    document.getElementById("dashboard-headline").innerHTML += username;
    displayTip(tutorialActive, twoFactorEnabled);
    removeLoader();
  }

  function displayTip(tutorialActive, twoFactorEnabled) {
    if (!twoFactorEnabled) {
      document.getElementById("dashboard-tip").appendChild(createTip(
        "{% trans 'product.dashboard.tip.2fa.headline' %}",
        "{% trans 'product.dashboard.tip.2fa.description' %}", "dashboard-tip-issue"));
    } else {
      document.getElementById("dashboard-tip-container").classList.add("d-none");
    }
  }

  function createTip(headline, description, type) {
    let tipElement = document.createElement("div");
    tipElement.classList.add(type);
    let headlineElement = document.createElement("h4");
    headlineElement.innerHTML = headline;
    tipElement.appendChild(headlineElement);
    let descriptionElement = document.createElement("span");
    descriptionElement.innerHTML = description;
    tipElement.appendChild(descriptionElement);
    return tipElement;
  }

  function fetchUsername(callback) {
    let request = new HttpRequest("/settings/profile/username/", "GET", []);
    request.send(function (status, responseText) {
      let response = JSON.parse(responseText);
      callback(response.username);
    });
  }

  function fetch2FA(callback) {
    let request = new HttpRequest("/settings/2fa/", "GET", []);
    request.send(function (status, responseText) {
      let response = JSON.parse(responseText);
      callback(response.enabled);
    });
  }

  function displayLoader() {
    let loader = document.createElement("div");
    loader.classList.add("loader");
    document.getElementById("dashboard-container").appendChild(loader);
  }

  function removeLoader() {
    document.getElementById("dashboard-container").removeChild(document.getElementsByClassName("loader")[0]);
    document.getElementById("dashboard-wrapper").classList.remove("d-none");
  }
</script>
