{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="light" data-bs-theme="light">
    {% include 'product-header.html' %}
    {% include 'product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="cards-container">
        <div id="cards-wrapper">
          <div class="position-relative d-flex justify-content-center align-items-lg-center my-5 py-4">
            <h1 class="fw-bold m-0 position-absolute start-50 translate-middle-x">{% trans 'product.cards.headline' %}</h1>
            <div class="ms-lg-auto mt-lg-0 mt-5 pt-lg-0 pt-5">
              <button id="card-create" class="btn btn-primary fw-bold"><i class="fa-solid fa-plus me-1"></i> {% trans 'product.cards.create' %}</button>
            </div>
          </div>
          <ul id="cards-placeholders" class="cards-list">
            <li class="card-container">
              <div class="card placeholder-glow d-flex align-items-end justify-content-end">
                <img class="card-logo placeholder rounded-4" src="" width="72px" height="72px" alt="">
                <div class="w-100 placeholder rounded py-3"></div>
              </div>
            </li>
            <li class="card-container">
              <div class="card placeholder-glow d-flex align-items-end justify-content-end">
                <img class="card-logo placeholder rounded-4" src="" width="72px" height="72px" alt="">
                <i class="card-type-member fa-solid fa-crown placeholder rounded"></i>
              </div>
            </li>
          </ul>
          <ul id="cards-list" class="cards-list">
          </ul>
          <div id="cards-empty" class="d-none">
            <p id="cards-empty-headline" class="mb-sm-1 mb-3">{% trans 'product.cards.empty.headline' %}</p>
            <span>{% trans 'product.cards.empty.text' %}</span><a href="/card/create/">{% trans 'product.cards.empty.link' %}</a><span>?</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  $(document).ready(function () {
    fetchCards(function (cards) {
      document.getElementById("cards-placeholders").classList.add("d-none");
      displayCards(cards);
    });
  });

  function fetchCards(callback) {
    let request = new HttpRequest("/cards/list/", "GET", []);
    request.send(function (status, responseText) {
      callback(JSON.parse(responseText).cards);
    });
  }

  function displayCards(cards) {
    for (let i = 0; i < cards.length; i++) {
      displayCard(cards[i]);
    }
    if (cards.length === 0) {
      document.getElementById("cards-empty").classList.remove("d-none");
    }
    if (cards.length === 1) {
      document.getElementById("cards-list").style.gridTemplateColumns = "repeat(1, 1fr)";
    }
  }

  function displayCard(card) {
    let cardContainer = document.createElement("li");
    cardContainer.classList.add("card-container");
    let cardElement = document.createElement("div");
    cardElement.classList.add("card", "d-flex", "align-items-end",
      "justify-content-end");
    cardElement.style.backgroundColor = card.backgroundColor;
    let cardLogo = document.createElement("img");
    cardLogo.classList.add("card-logo");
    cardLogo.src = "data:image/png;base64," + card.logo;
    cardElement.appendChild(cardLogo);
    if (card.type === "COLLECTION" || card.type === "VALUE") {
      cardElement.appendChild(createCardStamps(card.foregroundColor));
    } else if (card.type === "MEMBER") {
      let memberElement = document.createElement("i");
      memberElement.classList.add("card-type-member", "fa-solid",
        "fa-crown");
      memberElement.style.color = card.foregroundColor;
      cardElement.appendChild(memberElement);
    }
    cardContainer.appendChild(cardElement);
    cardContainer.role = "button";
    cardContainer.onclick = function (event) {
      window.location.href = "/card/" + card.id;
    }
    document.getElementById("cards-list").appendChild(cardContainer);
  }

  function createCardStamps(foregroundColor) {
    let cardStampContainer = document.createElement("div");
    cardStampContainer.classList.add("d-flex", "align-items-center",
      "justify-content-evenly", "w-100");
    for (let i = 0; i < 10; i++) {
      let cardStampElement = document.createElement("div");
      cardStampElement.classList.add("card-stamp");
      cardStampElement.style.border = "3px solid " + foregroundColor;
      if (i < 3) {
        cardStampElement.classList.add("signup-card-stamp-collected");
        cardStampElement.style.backgroundColor = foregroundColor;
      }
      cardStampContainer.appendChild(cardStampElement);
    }
    return cardStampContainer;
  }

  document.getElementById("card-create").addEventListener("click", function (event) {
    window.location.href = "/card/create/";
  });
</script>
