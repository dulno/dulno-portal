{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="light" data-bs-theme="light">
    {% include 'product-header.html' %}
    {% include 'product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="help-wrapper">
        <h1 id="help-headline">{% trans 'product.help.headline' %}</h1>
        <div id="help-accordion" class="accordion">
          <div class="accordion-item">
            <h2 id="help-support-question-headline" class="accordion-header">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#help-support-question" aria-expanded="true" aria-controls="help-support-question">
                {% trans 'product.help.question.support.question' %}
              </button>
            </h2>
            <div id="help-support-question" class="accordion-collapse collapse" aria-labelledby="help-support-question-headline" data-bs-parent="#help-accordion">
              <div class="accordion-body">
                {% trans 'product.help.question.support.answer' %}
              </div>
            </div>
          </div>
          <div class="accordion-item">
            <h2 id="help-delete-question-headline" class="accordion-header">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#help-delete-question" aria-expanded="true" aria-controls="help-delete-question">
                {% trans 'product.help.question.delete.question' %}
              </button>
            </h2>
            <div id="help-delete-question" class="accordion-collapse collapse" aria-labelledby="help-delete-question-headline" data-bs-parent="#help-accordion">
              <div class="accordion-body">
                {% trans 'product.help.question.delete.answer' %}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
