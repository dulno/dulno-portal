stages:
  - build
  - scan
  - publish
  - deploy
  - merge

variables:
  DOCKER_IMAGE: "dulno-portal"
  DOCKER_PROXY_IMAGE: "dulno-portal-proxy"
  KUBERNETES_RESOURCE: "deployment/dulno-portal-deployment"
  KUBERNETES_PROXY_RESOURCE: "deployment/dulno-portal-proxy-deployment"
  STAGING_PROXY_SERVER_NAME: "10.96.0.8"
  PRODUCTION_PROXY_SERVER_NAME: "portal.dulno.com"

include:
  - project: 'dulno/dulno-template'
    file: '/web/web-template.yml'