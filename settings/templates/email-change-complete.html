{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="light" data-bs-theme="light">
    <div id="email-change">
    </div>
  </body>
</html>

<script>
  $(document).ready(function() {
    let request = new HttpRequest("/settings/account/email/change/complete/", "POST",
      [], {member: "{{member}}", token: "{{token}}"});
    request.send(function (status, responseText) {
      if (status !== 200) {
        Swal.fire("{% trans 'settings.account.email.change.complete.failed.title' %}",
          "{% trans 'settings.account.email.change.complete.failed.status' %}", "error")
          .then(success => window.location.href = "/");
        return;
      }
      let response = JSON.parse(responseText);
      if (response.success === false) {
        if (response.error === 1000 || response.error === 1001) {
          Swal.fire("{% trans 'settings.account.email.change.complete.failed.title' %}",
            "{% trans 'settings.account.email.change.complete.failed.expired' %}", "error")
            .then(success => window.location.href = "/");
        }
      } else {
        Swal.fire("{% trans 'settings.account.email.change.complete.success.title' %}",
          "{% trans 'settings.account.email.change.complete.success.body' %}", "success")
          .then(success => finishEmailChange());
      }
    });
  });

  function finishEmailChange() {
    let request = new HttpRequest("/verification/logout/", "GET", []);
    request.send(function (status, responseText) {
      Cookie.destroy("token");
      Cookie.destroy("refresh-token");
      Cookie.destroy("home-token");
      window.location.href = "/login/";
    });
  }
</script>
