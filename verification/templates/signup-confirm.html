{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="light" data-bs-theme="light" notheme>
    <div class="loader">
    </div>
  </body>
</html>

<script>
  $(document).ready(function() {
    let request = new HttpRequest("/verification/complete/", "POST",
      [], {member: "{{member}}", token: "{{token}}"});
    request.send(function (status, responseText) {
      let response = JSON.parse(responseText);
      if (response.success === false) {
        window.location.href = "/";
        return;
      }
      Cookie.create("home-token", response.homeApiKey, 60 * 60);
      if ("{{redirect}}" !== "") {
        window.location.href = "{{redirect}}";
        return;
      }
      Cookie.create("expiration-has-personal-package", "false", 60 * 60);
      Cookie.create("expiration-member-name", response.memberName, 60 * 60);
      window.location.href = "/expiration/";
    });
  });
</script>
