{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="light" data-bs-theme="light" notheme>
    <div id="offer-content">
      <div id="offer-container" class="d-none">
        <div id="offer-wrapper">
          <div id="offer-header">
            <a href="/" id="offer-logo"><img src="{% static 'img/logo-light.webp' %}" alt=""></a>
            <h2 class="fw-bold">{% trans 'offer.headline' %}</h2>
            <div data-bs-theme="dark">
              {% include 'home-language.html' %}
            </div>
          </div>
          <div id="offer-body">
            <div id="offer-pay" class="d-none">
              <div id="offer-package">
                <div class="d-flex justify-content-center align-items-center">
                  <h3 class="fw-bold">{% trans 'offer.package.type' %} - </h3><h3 id="offer-package-type" class="fw-bold ms-2"></h3>
                </div>
                <div class="d-flex align-items-center mt-5 mb-3">
                  <div class="offer-package-separator"></div>
                  <span class="text-center text-secondary text-nowrap fw-bold">{% trans 'offer.price' %}</span>
                  <div class="offer-package-separator"></div>
                </div>
                <h2 id="offer-package-price" class="text-center mt-4 fw-bold"></h2>
                <p id="offer-package-offer-interval" class="text-center">{% trans 'offer.package.per.month' %}</p>
                <div class="text-center">
                  <span>{% trans 'offer.package.runtime' %}: </span><span id="offer-package-runtime"></span>
                </div>
                <p id="offer-pay-method-headline" class="text-center mt-5">{% trans 'offer.pay.methods' %}</p>
                <div id="offer-pay-method-list">
                  <img src="https://js.stripe.com/v3/fingerprinted/img/amex-b933c9009eeaf8cfd07e789c549b8c57.svg">
                  <img src="https://js.stripe.com/v3/fingerprinted/img/mastercard-86e9a2b929496a34918767093c470935.svg">
                  <img src="https://js.stripe.com/v3/fingerprinted/img/visa-fb36094822f73d7bc581f6c0bad1c201.svg">
                  <img src="https://js.stripe.com/v3/fingerprinted/img/sepa_debit-dark-2267c20803e67b8bb19eda68d42b20df.svg">
                  <img src="https://js.stripe.com/v3/fingerprinted/img/paypal-dark-b75755d2b5f200ed5a3d4e57fb111a8e.svg">
                </div>
                <div class="d-flex align-items-center my-5">
                  <div class="offer-package-separator"></div>
                </div>
                <div class="d-flex justify-content-md-around justify-content-center align-items-center flex-md-row flex-column">
                  <button type="button" id="offer-accept" class="btn btn-success px-3 me-md-1 mb-md-0 mb-3">{% trans 'offer.accept' %}</button>
                  <button type="button" id="offer-decline" class="btn btn-danger px-3 ms-md-1">{% trans 'offer.decline' %}</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  $(document).ready(function() {
    displayLoader();
    if (Cookie.find("home-token") == null) {
      window.location.href = "/login/?redirect=" +
        window.location.href.replace("{{base_url}}", "");
      return;
    }
    fetchOffer(function (offer) {
      if (!offer.found) {
        window.location.href = "/";
        return;
      }
      displayOffer(offer);
      removeLoader();
    });
  });

  function displayOffer(offer) {
    document.getElementById("offer-pay").classList.remove("d-none");
    displayPackageType(offer.type);
    displayPackageRuntime(offer.runtime);
    document.getElementById("offer-package-price").innerHTML = offer.price + " €";
  }

  function displayPackageType(packageType) {
    if (packageType === "BASIC") {
      document.getElementById("offer-package-type").innerHTML =
        "{% trans 'offer.package.type.basic' %}";
    } else if (packageType === "PROFESSIONAL") {
      document.getElementById("offer-package-type").innerHTML =
        "{% trans 'offer.package.type.professional' %}";
    } else if (packageType === "PREMIUM") {
      document.getElementById("offer-package-type").innerHTML =
        "{% trans 'offer.package.type.premium' %}";
    } else if (packageType === "ENTERPRISE") {
      document.getElementById("offer-package-type").innerHTML =
        "{% trans 'offer.package.type.enterprise' %}";
    }
  }

  function displayPackageRuntime(packageRuntime) {
    if (packageRuntime === "MONTHLY") {
      document.getElementById("offer-package-runtime").innerHTML =
        "{% trans 'offer.package.runtime.month' %}";
    } else if (packageRuntime === "YEARLY") {
      document.getElementById("offer-package-runtime").innerHTML =
        "{% trans 'offer.package.runtime.year' %}";
    }
  }

  document.getElementById("offer-accept").onclick = function (event) {
    let request = new HttpRequest("/offer/accept/", "POST",
      [], {offer: "{{offer}}"});
    request.send(function (status, responseText) {
      let response = JSON.parse(responseText);
      if (!response.success) {
        return;
      }
      window.location.href = response.link;
    });
  }

  document.getElementById("offer-decline").onclick = function (event) {
    let request = new HttpRequest("/offer/decline/", "POST",
      [], {offer: "{{offer}}"});
    request.send(function (status, responseText) {
      window.location.href = "/";
    });
  }

  function fetchOffer(callback) {
    let request = new HttpRequest("/offer/find/", "POST",
      [], {offer: "{{offer}}"});
    request.send(function (status, responseText) {
      if (status === 403) {
        window.location.href = "/login/?redirect=/offer/" + "{{offer}}" + "/";
        return;
      }
      callback(JSON.parse(responseText));
    });
  }

  function displayLoader() {
    let loader = document.createElement("div");
    loader.classList.add("loader");
    document.getElementById("offer-content").appendChild(loader);
  }

  function removeLoader() {
    document.getElementById("offer-content")
      .removeChild(document.getElementsByClassName("loader")[0]);
    document.getElementById("offer-container").classList.remove("d-none");
  }
</script>
