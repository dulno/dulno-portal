{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="light" data-bs-theme="light" notheme>
    <div id="password-reset-container">
      <div id="password-reset-wrapper">
        <div id="password-reset-header">
          <a href="/" id="password-reset-logo"><img src="{% static 'img/logo-light.webp' %}" alt=""></a>
          <h2 class="fw-bold mb-0">{% trans 'password.reset.request.headline' %}</h2>
          <div data-bs-theme="dark">
            {% include 'home-language.html' %}
          </div>
        </div>
        <form>
          <div class="form-outline mb-4">
            <label for="email" class="form-label">{% trans 'password.reset.request.email' %}</label>
            <input type="email" id="email" class="form-control" placeholder="{% trans 'password.reset.request.email' %}">
          </div>
          <button type="button" id="send">{% trans 'password.reset.request.send' %}</button></br>
          <label id="password-reset-status" class="mt-4 fw-bold d-none"></label>
        </form>
      </div>
    </div>
  </body>
</html>

<script>
  document.getElementById("email").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      document.getElementById("send").click();
    }
  });

  document.getElementById('send').onclick = function() {
    let request = new HttpRequest("/password/reset/request/", "POST", [],
      {email: document.getElementById("email").value});
    request.send(function (status, responseText) {
      let response = JSON.parse(responseText);
      let statusElement = document.getElementById("password-reset-status");
      statusElement.classList.remove("d-none");
      if (response.success === false) {
        statusElement.classList.remove("text-success");
        statusElement.classList.add("text-danger");
        if (response.errorCode === 1000) {
          statusElement.innerHTML = "{% trans 'password.reset.request.failed.not.found' %}";
        }
      } else {
        statusElement.classList.remove("text-danger");
        statusElement.classList.add("text-success");
        statusElement.innerHTML = "{% trans 'password.reset.request.success' %}";
      }
    });
  };
</script>
