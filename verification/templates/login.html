{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="light" data-bs-theme="light" notheme>
    <div id="login-container">
      <div id="login-wrapper">
        <div id="login-header">
          <img id="login-logo" src="{% static 'img/logo-light.webp' %}">
          <h2 class="mt-3 fw-bold">{% trans 'login.headline' %}</h2>
          <div data-bs-theme="dark">
            {% include 'home-language.html' %}
          </div>
        </div>
        <form>
          <div class="form-outline mb-4">
            <label for="email" class="form-label">{% trans 'login.email' %}</label>
            <input type="email" id="email" class="form-control" placeholder="{% trans 'login.email' %}">
          </div>
          <div class="form-outline mb-4">
            <div class="d-flex">
              <label for="password" class="form-label">{% trans 'login.password' %}</label>
              <a id="forgot-password" href="/password/reset/request/">{% trans 'login.password.forgot' %}</a>
            </div>
            <div class="password-container">
              <input type="password" id="password" class="form-control" placeholder="{% trans 'login.password' %}"/>
              <button id="password-toggle" class="password-toggle">
                <i id="password-toggle-icon" class="password-toggle-icon fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="remember-check">
            <label class="form-check-label" for="remember-check" id="remember-check-label">{% trans 'login.remember' %}</label>
          </div>
          <div class="text-center">
            <button type="button" id="login">{% trans 'login.button' %}</button></br>
            <p>{% trans 'login.signup' %} <a id="not-registered" class="text-decoration-none" href="/signup/">{% trans 'login.account.create' %}</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>

{% include '2fa.html' %}

<script>
  $(document).ready(function() {
    let rememberMe = Cookie.find("dulno-remember-me");
    if (rememberMe != null) {
      document.getElementById("email").value = rememberMe;
    }
  });

  document.getElementById("email").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      document.getElementById("password").focus();
    }
  });

  document.getElementById("password").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      document.getElementById("login").click();
    }
  });

  document.getElementById('login').onclick = function(event) {
    document.getElementById("login").innerHTML = "{% trans 'login.button' %}" + `
      <span class="spinner-border spinner-border-sm ms-2" aria-hidden="true"></span>
      <span class="visually-hidden" role="status">Loading...</span>
    `;
    login("");
  };

  function login(multiFactorCode) {
    if (document.getElementById("remember-check").checked) {
      Cookie.create("dulno-remember-me", document.getElementById("email").value,
        12 * 30 * 24 * 60 * 60);
    }
    let request = new HttpRequest("/verification/login/", "POST", [],
      {email: document.getElementById("email").value, password: document.getElementById("password").value,
        multiFactorCode: multiFactorCode});
    request.send(function (status, responseText) {
      let response = JSON.parse(responseText);
      if ("homeApiKey" in response) {
        Cookie.create("home-token", response.homeApiKey, 60 * 60);
      }
      let success = response.success;
      if (success === true) {
        Cookie.create("token", response.productApiKey, 60 * 60 * 24 * 30);
        Cookie.create("refresh-token", response.refreshToken, 60 * 60 * 24 * 30);
        sessionStorage.removeItem("dulno-bundle");
        if (!redirect()) {
          window.location.href = "/dashboard/";
        }
      } else {
        let error = response.error;
        if (error === 1002) {
          if (multiFactorCode === "") {
            display2FA(function(code) {login(code)});
          } else {
            Swal.fire("{% trans 'login.failed.two.factor.title' %}", "{% trans 'login.failed.two.factor.body' %}", "error").then((result) => {
              if (result.isConfirmed) {
                display2FA(function(code) {login(code)});
              } else {
                document.getElementById("login").innerHTML = "{% trans 'login.button' %}";
              }
            });
          }
          return;
        }
        if (error === 1000) {
          Swal.fire("{% trans 'login.failed.credentials.title' %}", "{% trans 'login.failed.credentials.body' %}", "error");
        } else  if (error === 1001) {
          Swal.fire("{% trans 'login.failed.confirmation.title' %}", "{% trans 'login.failed.confirmation.body' %}", "error");
        } else  if (error === 1003) {
          if (!redirect()) {
            Cookie.create("expiration-member-name", response.memberName, 60 * 60);
            window.location.href = "/expiration/";
          }
        }
        document.getElementById("password").value = "";
        document.getElementById("login").innerHTML = "{% trans 'login.button' %}";
      }
    });
  }

  function redirect() {
    if ("{{redirect}}" !== "") {
      window.location.href = "{{redirect}}";
      return true;
    }
    return false;
  }

  document.getElementById("password-toggle").addEventListener("click", function(event) {
    event.preventDefault();
    let input = document.getElementById("password");
    let type = input.getAttribute("type") === "password" ? "text" : "password";
    input.setAttribute("type", type);
    let icon = document.getElementById("password-toggle-icon");
    if (type === "password") {
      icon.classList.remove("fa-eye-slash");
      icon.classList.add("fa-eye");
    } else {
      icon.classList.remove("fa-eye");
      icon.classList.add("fa-eye-slash");
    }
  });
</script>
